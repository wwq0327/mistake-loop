<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>题目详情 · mistake-loop</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body data-page="detail">
  <div class="shell">
    <header class="topbar">
      <span class="topbar__brand">mistake-loop</span>
      <span class="topbar__spacer"></span>
      <span class="small muted">题目详情</span>
    </header>
    <nav class="sidebar" aria-label="主导航">
      <span class="sidebar__brand">mistake-loop</span>
      <a href="/" class="nav-link">工作台</a>
      <a href="/inbox" class="nav-link">识别收件箱</a>
      <a href="/print" class="nav-link">打印</a>
      <a href="/library" class="nav-link">题库</a>
      <a href="/settings" class="nav-link">设置</a>
    </nav>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <h1>一道题的一生</h1>
          <p>原图、诊断、三层变式、复习留痕与掌握证据，都在这里。</p>
        </div>
        <div class="field">
          <label for="page-q">在本页查找</label>
          <input id="page-q" class="input" type="search" placeholder="输入关键词，过滤本页内容">
        </div>

        <section class="card">
          <div class="card__body">
            <div id="detail-progress" class="progress">
              <div class="progress__step" role="list">
                <div data-step="new">待诊断</div>
                <div data-step="diagnosing">诊断中</div>
                <div data-step="correcting">纠错中</div>
                <div data-step="reviewing">复习中</div>
                <div data-step="mastered">已掌握</div>
              </div>
            </div>
            <p id="detail-gate" class="alert alert--warn">还差什么才能往下走：正在读取这道题…</p>
          </div>
        </section>

        <section id="detail-basics" class="card">
          <div class="card__head"><h2>原题与教材定位</h2></div>
          <div class="card__body">
            <img id="detail-image" class="qcard__figure" alt="这道题的原图">
          </div>
        </section>
        <section id="detail-diagnosis" class="card">
          <div class="card__head"><h2>诊断与学生结论</h2></div>
          <div class="card__body"></div>
        </section>
        <section id="detail-variants" class="card">
          <div class="card__head"><h2>三层变式审核</h2></div>
          <div class="card__body"></div>
        </section>
        <section id="detail-reviews" class="card">
          <div class="card__head"><h2>复习事件与调度留痕</h2></div>
          <div class="card__body"></div>
        </section>
        <section id="detail-evidence" class="card">
          <div class="card__head"><h2>掌握证据</h2></div>
          <div class="card__body"></div>
        </section>
        <div id="view" class="stack" aria-live="polite"></div>
      </div>
    </main>
    <nav class="tabbar" aria-label="手机导航">
      <a href="/" class="tab-link">工作台</a>
      <a href="/inbox" class="tab-link">收件箱</a>
      <a href="/print" class="tab-link">打印</a>
      <a href="/library" class="tab-link">题库</a>
      <a href="/settings" class="tab-link">设置</a>
    </nav>
  </div>
  <div id="toast-host" aria-live="polite"></div>
  <script type="module" src="/js/router.js"></script>
</body>
</html>
