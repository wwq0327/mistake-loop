<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台 · mistake-loop</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body data-page="workbench">
  <div class="shell">
    <header class="topbar">
      <span class="topbar__brand">mistake-loop</span>
      <span class="topbar__spacer"></span>
      <span class="small muted">工作台</span>
    </header>
    <nav class="sidebar" aria-label="主导航">
      <span class="sidebar__brand">mistake-loop</span>
      <a href="/" class="nav-link">工作台</a>
      <a href="/inbox" class="nav-link">识别收件箱</a>
      <a href="/print" class="nav-link">打印</a>
      <a href="/library" class="nav-link">题库</a>
      <a href="/settings" class="nav-link">设置</a>
    </nav>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <h1>今天该做什么</h1>
          <p>四个数字，四个动作。到期的题自己会出现，不用手动算日子。</p>
        </div>
        <div class="field">
          <label for="page-q">在本页查找</label>
          <input id="page-q" class="input" type="search" placeholder="输入关键词，过滤本页内容">
        </div>

        <div class="grid grid--stats" id="workbench-kpis">
          <a class="card" data-kpi="pendingDrafts" data-kpi-href="/inbox" href="/inbox">
            <div class="card__body"><div class="stat" id="kpi-pendingDrafts">—</div><div class="stat-label">待确认识别草稿</div></div>
          </a>
          <a class="card" data-kpi="today" data-kpi-href="/print" href="/print">
            <div class="card__body"><div class="stat" id="kpi-today">—</div><div class="stat-label">今日该复习</div></div>
          </a>
          <a class="card" data-kpi="overdue" data-kpi-href="/print" href="/print">
            <div class="card__body"><div class="stat" id="kpi-overdue">—</div><div class="stat-label">逾期未练</div></div>
          </a>
          <a class="card" data-kpi="awaitingTextbookRef" data-kpi-href="/library" href="/library">
            <div class="card__body"><div class="stat" id="kpi-awaitingTextbookRef">—</div><div class="stat-label">待补教材定位</div></div>
          </a>
        </div>

        <div id="workbench-actions" class="row"></div>
        <section id="workbench-today" class="card">
          <div class="card__head"><h2>今日复习</h2><span class="small muted">按到期日排序</span></div>
          <div class="card__body"></div>
        </section>
        <section id="workbench-pending" class="card">
          <div class="card__head"><h2>待审核变式</h2></div>
          <div class="card__body"></div>
        </section>
        <div id="view" class="stack" aria-live="polite"></div>
      </div>
    </main>
    <nav class="tabbar" aria-label="手机导航">
      <a href="/" class="tab-link">工作台</a>
      <a href="/inbox" class="tab-link">收件箱</a>
      <a href="/print" class="tab-link">打印</a>
      <a href="/library" class="tab-link">题库</a>
      <a href="/settings" class="tab-link">设置</a>
    </nav>
  </div>
  <div id="toast-host" aria-live="polite"></div>
  <script type="module" src="/js/router.js"></script>
</body>
</html>
