<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导出 A4 练习纸 · mistake-loop</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/print.css" media="print">
</head>
<body data-page="print">
  <div class="shell">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="topbar__brand" href="/"><span class="topbar__logo" aria-hidden="true">↻</span>错题循环</a>
        <nav class="topbar__nav" aria-label="主导航">
          <a href="/" class="nav-link">工作台</a>
          <a href="/inbox" class="nav-link">识别收件箱</a>
          <a href="/print" class="nav-link" aria-current="page">打印</a>
          <a href="/library" class="nav-link">题库</a>
          <a href="/settings" class="nav-link">设置</a>
        </nav>
        <span class="topbar__aside">打印</span>
      </div>
    </header>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div class="page-head__text">
            <p class="page-head__kicker">教师工作台 / 导出练习纸</p>
            <h1>导出 A4 练习纸</h1>
            <p>默认带今日复习；学生版不含答案与引导提示，一题一张卡片。</p>
          </div>
        </div>
        <div class="field">
          <label for="page-q">在本页查找</label>
          <input id="page-q" class="input" type="search" placeholder="输入关键词，过滤本页内容">
        </div>

        <section id="print-picker" class="card">
          <div class="card__head">
            <h2>选题</h2>
            <span class="small muted">默认已带今日复习；勾选可加、取消可减，当前 <strong id="print-selected-count">0</strong> 道</span>
          </div>
          <div class="card__body">
            <div class="field">
              <label for="print-q">在候选题里找</label>
              <input id="print-q" class="input" type="search" placeholder="输入题干或单元关键词">
            </div>
            <div id="print-actions" class="row"></div>
            <div id="print-candidates" class="stack"></div>
          </div>
        </section>

        <section id="print-preview" class="card">
          <div class="card__head">
            <h2 id="print-preview-title">A4 预览</h2>
            <span class="small muted">打印出来的就是这一块</span>
          </div>
          <div class="card__body" id="print-preview-body"></div>
        </section>
        <div id="view" class="stack" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <div id="toast-host" aria-live="polite"></div>
  <script type="module" src="/js/router.js"></script>
</body>
</html>
