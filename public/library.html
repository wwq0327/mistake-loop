<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>题库 · mistake-loop</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body data-page="library">
  <div class="shell">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="topbar__brand" href="/"><span class="topbar__logo" aria-hidden="true">↻</span>错题循环</a>
        <nav class="topbar__nav" aria-label="主导航">
          <a href="/" class="nav-link">工作台</a>
          <a href="/inbox" class="nav-link">识别收件箱</a>
          <a href="/print" class="nav-link">打印</a>
          <a href="/library" class="nav-link" aria-current="page">题库</a>
          <a href="/settings" class="nav-link">设置</a>
        </nav>
        <span class="topbar__aside">题库</span>
      </div>
    </header>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <div class="page-head__text">
            <p class="page-head__kicker">教师工作台 / 题库</p>
            <h1>翻题库</h1>
            <p>按科目、状态、教材定位检索；补定位可以批量做。</p>
          </div>
        </div>
        <div class="field">
          <label for="page-q">在本页查找</label>
          <input id="page-q" class="input" type="search" placeholder="输入关键词，过滤本页内容">
        </div>

        <section id="library-filters" class="card">
          <div class="card__head">
            <h2>筛选</h2>
            <span class="small muted" id="library-summary">正在读取实时统计…</span>
          </div>
          <div class="card__body">
            <div class="field-row">
              <div class="field">
                <label for="library-filter-subject">科目</label>
                <select id="library-filter-subject" class="select"></select>
              </div>
              <div class="field">
                <label for="library-filter-status">状态</label>
                <select id="library-filter-status" class="select"></select>
              </div>
              <div class="field">
                <label for="library-filter-node">教材单元</label>
                <select id="library-filter-node" class="select"></select>
              </div>
              <div class="field">
                <label for="library-filter-pending">只看待补定位</label>
                <input id="library-filter-pending" type="checkbox">
              </div>
            </div>
          </div>
        </section>

        <section id="library-batch" class="card">
          <div class="card__head">
            <h2>批量补教材定位</h2>
            <span class="small muted" id="library-batch-selected">已勾选 0 道</span>
          </div>
          <div class="card__body">
            <div class="field-row">
              <div class="field">
                <label for="library-batch-node">挂到哪个教材单元</label>
                <select id="library-batch-node" class="select"></select>
              </div>
              <button id="library-batch-apply" class="btn btn--primary" type="button">批量挂上</button>
              <button id="library-select-all" class="btn btn--ghost" type="button">勾选本次结果</button>
            </div>
            <p class="field__hint">挂错科目的节点会被整批拒绝，不会有半批写入；教材单元与所有计数都来自实时查询。</p>
          </div>
        </section>

        <section id="library-list" class="card">
          <div class="card__head"><h2>题目列表</h2></div>
          <div class="card__body" id="library-list-body"></div>
        </section>
        <div id="view" class="stack" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <div id="toast-host" aria-live="polite"></div>
  <script type="module" src="/js/router.js"></script>
</body>
</html>
