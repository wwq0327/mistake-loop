<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>识别收件箱 · mistake-loop</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body data-page="inbox">
  <div class="shell">
    <header class="topbar">
      <span class="topbar__brand">mistake-loop</span>
      <span class="topbar__spacer"></span>
      <span class="small muted">识别收件箱</span>
    </header>
    <nav class="sidebar" aria-label="主导航">
      <span class="sidebar__brand">mistake-loop</span>
      <a href="/" class="nav-link">工作台</a>
      <a href="/inbox" class="nav-link">识别收件箱</a>
      <a href="/print" class="nav-link">打印</a>
      <a href="/library" class="nav-link">题库</a>
      <a href="/settings" class="nav-link">设置</a>
    </nav>
    <main class="main">
      <div class="content">
        <div class="page-head">
          <h1>收一道新题</h1>
          <p>先收照片，再看识别草稿。老师逐题确认后才算入库。</p>
        </div>
        <div class="field">
          <label for="page-q">在本页查找</label>
          <input id="page-q" class="input" type="search" placeholder="输入关键词，过滤本页内容">
        </div>

        <section id="inbox-workspace" class="split">
          <div class="split__pane split__pane--figure">
            <section id="inbox-upload" class="card">
              <div class="card__head"><h2>收一张照片</h2></div>
              <div class="card__body">
                <div class="field">
                  <label for="inbox-file">拍照或选择题目照片</label>
                  <input id="inbox-file" class="input" type="file" accept="image/*" capture="environment" multiple>
                </div>
                <p class="field__hint">原图始终留在本机；只有开启 AI 后才会把压缩图发往你配置的服务商。</p>
                <div id="inbox-queue" class="row" aria-live="polite"></div>
                <div id="inbox-job-picker" class="row"></div>
              </div>
            </section>
            <section id="inbox-figure" class="card">
              <div class="card__head"><h2>原图与识别框</h2><span class="small muted">点框定位到对应草稿</span></div>
              <div class="card__body">
                <div id="inbox-image-wrap">
                  <img id="inbox-image" alt="题目原图，尚未选择照片">
                  <div id="inbox-bboxes"></div>
                </div>
              </div>
            </section>
          </div>
          <div id="inbox-drafts" class="split__pane stack"></div>
        </section>

        <div id="inbox-fallback" class="alert alert--warn">
          AI 没读懂、没启用或识别失败时，原图仍在这里。用下面这张空白草稿改为手工录入，功能完全等价。
          <button id="inbox-manual" class="btn btn--ghost" type="button">改为手工录入</button>
        </div>
        <div id="view" class="stack" aria-live="polite"></div>
      </div>
    </main>
    <nav class="tabbar" aria-label="手机导航">
      <a href="/" class="tab-link">工作台</a>
      <a href="/inbox" class="tab-link">收件箱</a>
      <a href="/print" class="tab-link">打印</a>
      <a href="/library" class="tab-link">题库</a>
      <a href="/settings" class="tab-link">设置</a>
    </nav>
  </div>
  <div id="toast-host" aria-live="polite"></div>
  <script type="module" src="/js/router.js"></script>
</body>
</html>
