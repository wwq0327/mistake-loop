name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 与本机开发版本一致（Node 22 已实测 node:sqlite 可直接用）。
      # 生产容器锁 node:26-slim，待 setup-node 对该版本稳定支持后加入矩阵。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
